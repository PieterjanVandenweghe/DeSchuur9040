<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toilet-teller</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="theme-color" content="#ff6b35">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gedeeld/stijl.css">
<style>
.vraag{margin:16px 0 6px;font-weight:700}
.week{display:flex;gap:6px;margin-top:16px}.week div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:6px 0;font-size:1.3rem}.week small{display:block;font-size:.7rem;color:var(--soft)}
.knoppen button{padding:12px 6px}.knoppen small{display:block;font-size:.72rem}
.naam{font-size:1.4rem;font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../gedeeld/basis.js"></script>
<script>
const B = Basis, sb = B.sb, esc = B.esc, app = document.getElementById('app');
// Pas de schaal gerust aan: 5 stappen van zacht naar hard
const SCHAAL = [{ e: '💦', t: 'Waterval' }, { e: '🍦', t: 'Zacht ijsje' }, { e: '🍌', t: 'Perfecte banaan' }, { e: '🥜', t: 'Notenmix' }, { e: '🪨', t: 'Keitje' }];
const DAGNAMEN = ['zo', 'ma', 'di', 'woe', 'don', 'vrij', 'zat'];
let rijen = [], datum = B.dagMet(0);

B.start('🚽 Toilet-teller', laad);

async function laad() {
  if (!B.sessie) { app.innerHTML = '<p class="fout">Deze gegevens zijn privé. Log eerst in (knop rechtsboven).</p>'; return; }
  const r = await sb.from('toilet_dagen').select('*').gte('datum', B.dagMet(-30));
  if (r.error) { app.innerHTML = `<p class="fout">Laden mislukt: ${esc(r.error.message)}. Is toilet.sql uitgevoerd?</p>`; return; }
  rijen = r.data; render();
}

function zichtbaar() { return B.isOuder ? B.kinderen : B.kinderen.filter(k => B.mijnKind && k.id === B.mijnKind.id); }

function render() {
  const kaarten = zichtbaar().map(k => {
    const mijn = rijen.filter(r => r.kind_id === k.id), nu = mijn.find(r => r.datum === datum) || { geweest: false, hardheid: null, buikpijn: false, nieuw: true };
    const week = [-6, -5, -4, -3, -2, -1, 0].map(n => {
      const ds = B.dagMet(n), r = mijn.find(x => x.datum === ds);
      const e = !r ? '·' : (r.geweest ? (r.hardheid ? SCHAAL[r.hardheid - 1].e : '🚽') : '✖️') + (r.buikpijn ? '🤕' : '');
      return `<div>${e}<small>${DAGNAMEN[new Date(ds + 'T12:00').getDay()]}</small></div>`;
    }).join('');
    const kn = (cls, k2, v, tekst) => `<button class="${cls ? 'kies' : ''}" data-k="${k.id}" data-v="${k2}:${v}">${tekst}</button>`;
    return `<section class="kaart"><div class="naam">${esc(k.emoji)} ${esc(k.naam)}</div>
      <div class="vraag">Naar het toilet geweest?</div>
      <div class="knoppen">${kn(!nu.nieuw && nu.geweest, 'geweest', 1, 'Ja 🚽')}${kn(!nu.nieuw && !nu.geweest, 'geweest', 0, 'Nee')}</div>
      ${nu.geweest ? `<div class="vraag">Hoe was het?</div><div class="knoppen">${SCHAAL.map((s, i) => kn(nu.hardheid === i + 1, 'hardheid', i + 1, `${s.e}<small>${s.t}</small>`)).join('')}</div>` : ''}
      <div class="vraag">Buikpijn?</div>
      <div class="knoppen">${kn(nu.buikpijn, 'buikpijn', 1, 'Ja 🤕')}${kn(!nu.nieuw && !nu.buikpijn, 'buikpijn', 0, 'Nee 😊')}</div>
      <div class="week">${week}</div></section>`;
  }).join('') || '<p class="fout">Geen gegevens om te tonen. Log in als ouder, of als kind met je code.</p>';
  app.innerHTML = `<label class="sub" style="display:block;margin-bottom:12px">Dag: <input id="dag" type="date" max="${B.dagMet(0)}" value="${datum}" style="width:auto"></label>` + kaarten;
}

app.addEventListener('change', e => { if (e.target.id === 'dag' && e.target.value && e.target.value <= B.dagMet(0)) { datum = e.target.value; render(); } });
app.addEventListener('click', async e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const [veld, waarde] = b.dataset.v.split(':'), kid = b.dataset.k;
  const huidig = rijen.find(r => r.kind_id === kid && r.datum === datum) || { geweest: false, hardheid: null, buikpijn: false };
  const rij = { kind_id: kid, datum, geweest: huidig.geweest, hardheid: huidig.hardheid, buikpijn: huidig.buikpijn };
  if (veld === 'geweest') { rij.geweest = waarde === '1'; if (!rij.geweest) rij.hardheid = null; }
  if (veld === 'hardheid') { rij.hardheid = Number(waarde); rij.geweest = true; }
  if (veld === 'buikpijn') rij.buikpijn = waarde === '1';
  const { error } = await sb.from('toilet_dagen').upsert(rij, { onConflict: 'kind_id,datum' });
  if (error) return alert('Opslaan mislukt: ' + error.message);
  const i = rijen.findIndex(r => r.kind_id === kid && r.datum === datum);
  if (i >= 0) rijen[i] = rij; else rijen.push(rij);
  render();
});
</script>
</body>
</html>
