<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadeautjes</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="theme-color" content="#ff6b35">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gedeeld/stijl.css">
<style>
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button.act{background:var(--joker);color:#fff}
.vorm{display:grid;gap:8px}.vorm label{font-size:.9rem;color:var(--soft)}
.rij a{text-decoration:none}.claim{font-size:.9rem;color:var(--joker);font-weight:500}
.delen code{display:block;word-break:break-all;background:var(--bg);padding:8px;border-radius:10px;font-size:.8rem;margin:6px 0}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../gedeeld/basis.js"></script>
<script>
const B = Basis, sb = B.sb, esc = B.esc, app = document.getElementById('app');
let personen = [], items = [], claims = [], delen = [], gekozen = null, voorWie = null, me = null;

B.start('🎁 Cadeautjes', laad);
window.addEventListener('focus', () => { if (B.sessie) laad(); });

async function laad() {
  if (!B.sessie) { app.innerHTML = '<p class="fout">Log eerst in (knop rechtsboven).</p>'; return; }
  me = B.sessie.user.id;
  personen = [...B.ouders.map(o => ({ uid: o.user_id, naam: o.naam || 'Ouder', emoji: o.emoji || '🧑' })),
              ...B.kinderen.filter(k => k.user_id).map(k => ({ uid: k.user_id, naam: k.naam, emoji: k.emoji }))];
  const [i, c, d] = await Promise.all(['cadeau_items', 'cadeau_claims', 'cadeau_delen'].map(t => sb.from(t).select('*')));
  const fout = [i, c, d].find(r => r.error);
  if (fout) { app.innerHTML = `<p class="fout">Laden mislukt: ${esc(fout.error.message)}. Is cadeautjes.sql uitgevoerd?</p>`; return; }
  items = i.data.sort((a, b) => a.aangemaakt < b.aangemaakt ? -1 : 1); claims = c.data; delen = d.data;
  if (!gekozen || !personen.some(p => p.uid === gekozen)) gekozen = me;
  if (!voorWie || !personen.some(p => p.uid === voorWie)) voorWie = me;
  render();
}

const naamVan = uid => (personen.find(p => p.uid === uid) || { naam: 'Iemand' }).naam;
const mijnNaam = () => naamVan(me);
function veiligeLink(l) {
  if (!l) return null;
  try { const u = new URL(l.includes('://') ? l : 'https://' + l); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; }
}
const deelUrl = t => new URL('deel.html', location.href).href.split('#')[0] + '#' + t;

function render() {
  const chips = personen.map(p => `<button data-p="${p.uid}" class="${p.uid === gekozen ? 'act' : ''}">${esc(p.emoji)} ${esc(p.naam)}${p.uid === me ? ' (ik)' : ''}</button>`).join('');
  const eigen = gekozen === me;
  const lijst = items.filter(i => i.voor_user === gekozen);
  const rijen = lijst.map(i => {
    const c = claims.find(x => x.item_id === i.id), l = veiligeLink(i.link);
    const mag = i.toegevoegd_door === me || B.isOuder;
    let status = '';
    if (!eigen) {
      if (c) status = `<span class="claim">🎁 ${esc(c.door_naam)}</span>` + (c.door_user === me || B.isOuder ? ` <button data-unclaim="${i.id}">Toch niet</button>` : '');
      else status = `<button class="ja" data-claim="${i.id}">Ik koop dit</button>`;
    }
    return `<div class="rij"><span>${esc(i.titel)} ${l ? `<a href="${esc(l)}" target="_blank" rel="noopener noreferrer" aria-label="Open link">🔗</a>` : ''}</span>${status}${mag ? `<button data-del="${i.id}" aria-label="Verwijder">✕</button>` : ''}</div>`;
  }).join('') || '<p class="sub">Nog niets op dit lijstje.</p>';
  const links = delen.filter(d => d.voor_user === gekozen);
  const deelBlok = B.isOuder ? `<div class="kaart delen"><strong>Delen met mensen zonder account</strong>
    <p class="sub">Wie de link heeft, kan het lijstje van ${esc(naamVan(gekozen))} zien en aanduiden wat hij of zij koopt. ${eigen ? '' : `${esc(naamVan(gekozen))} mag deze link zelf niet openen, anders is de verrassing weg.`}</p>
    ${links.map(d => `<code>${esc(deelUrl(d.token))}</code><div class="rijknop" style="justify-content:flex-start"><button data-kopie="${d.token}">Kopieer</button><button class="nee" data-intrek="${d.id}">Intrekken</button></div>`).join('')}
    <div class="rijknop" style="justify-content:flex-start"><button class="ja" data-nieuwdeel="1">Nieuwe deellink maken</button></div></div>` : '';
  app.innerHTML = `<div class="chips">${chips}</div>
    <div class="kaart"><strong>Cadeautje toevoegen</strong><div class="vorm">
      <label for="voor">Voor wie?</label><select id="voor">${personen.map(p => `<option value="${p.uid}" ${p.uid === voorWie ? 'selected' : ''}>${esc(p.emoji)} ${esc(p.naam)}${p.uid === me ? ' (ik)' : ''}</option>`).join('')}</select>
      <input id="titel" type="text" maxlength="200" placeholder="Wat is het cadeautje?" autocomplete="off">
      <input id="link" type="text" inputmode="url" maxlength="1000" placeholder="Link (optioneel)" autocomplete="off">
      <button class="ja" data-toevoegen="1">Toevoegen</button></div></div>
    <div class="kaart"><strong>${eigen ? 'Mijn lijstje' : 'Lijstje van ' + esc(naamVan(gekozen))}</strong>${eigen ? '<p class="sub">Wie wat koopt, zie je niet. Dat blijft een verrassing 🎉</p>' : ''}${rijen}</div>${deelBlok}`;
}

async function doe(q) { const { error } = await q; if (error) { alert('Mislukt: ' + error.message); return false; } await laad(); return true; }

app.addEventListener('change', e => { if (e.target.id === 'voor') voorWie = e.target.value; });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'titel' || e.target.id === 'link')) { e.preventDefault(); toevoegen(); } });
async function toevoegen() {
  const titel = document.getElementById('titel').value.trim(), raw = document.getElementById('link').value.trim();
  if (!titel) return;
  const link = raw ? veiligeLink(raw) : null;
  if (raw && !link) return alert('Dat lijkt geen geldige link (http of https).');
  voorWie = document.getElementById('voor').value;
  if (await doe(sb.from('cadeau_items').insert({ voor_user: voorWie, titel, link }))) gekozen = voorWie, render();
}
app.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.p) { gekozen = d.p; return render(); }
  if (d.toevoegen) return toevoegen();
  if (d.del) { if (confirm('Dit cadeautje verwijderen?')) await doe(sb.from('cadeau_items').delete().eq('id', d.del)); return; }
  if (d.claim) return doe(sb.from('cadeau_claims').insert({ item_id: d.claim, door_user: me, door_naam: mijnNaam() }));
  if (d.unclaim) return doe(sb.from('cadeau_claims').delete().eq('item_id', d.unclaim));
  if (d.nieuwdeel) return doe(sb.from('cadeau_delen').insert({ voor_user: gekozen }));
  if (d.intrek) { if (confirm('Deellink intrekken? Wie hem heeft, kan er niet meer mee kijken.')) await doe(sb.from('cadeau_delen').delete().eq('id', d.intrek)); return; }
  if (d.kopie) { const u = deelUrl(d.kopie); try { await navigator.clipboard.writeText(u); t.textContent = 'Gekopieerd ✓'; } catch (x) { prompt('Kopieer deze link:', u); } }
});
</script>
</body>
</html>
