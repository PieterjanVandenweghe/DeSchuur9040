<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadeautjes</title>
<link rel="icon" href="../icon.svg">
<meta name="theme-color" content="#ff6b35">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gedeeld/stijl.css">
<style>.claim{font-size:.9rem;color:var(--joker);font-weight:500}.rij a{text-decoration:none}</style>
</head>
<body>
<header class="top"><h1 id="titel">🎁 Cadeautjes</h1></header>
<main id="app"><p class="sub">Laden…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script>
// Openbare pagina voor mensen met een geheime deellink: alleen deze lijst, geen account nodig.
const C = window.CONFIG, sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: false } });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = location.hash.slice(1), app = document.getElementById('app');
let naam = ''; try { naam = localStorage.getItem('deelnaam') || ''; } catch (e) {}
let lijst = [], info = null;
const euro = n => '€' + Number(n).toLocaleString('nl-BE', { maximumFractionDigits: 2 });
const prijsTekst = (v, t) => {
  const x = v == null ? null : Number(v), y = t == null ? null : Number(t);
  const s = x != null && y != null ? (x === y ? '± ' + euro(x) : euro(x) + '–' + euro(y).slice(1)) : y != null ? 'tot ' + euro(y) : x != null ? 'vanaf ' + euro(x) : '';
  return s ? ` <small class="sub">· ${esc(s)}</small>` : '';
};
const veilig = l => { if (!l) return null; try { const u = new URL(l); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; } };

async function laad() {
  if (!token) { app.innerHTML = '<p class="fout">Deze link is onvolledig.</p>'; return; }
  const [a, b] = await Promise.all([sb.rpc('cadeau_deel_info', { p_token: token }), sb.rpc('cadeau_deel_lijst', { p_token: token })]);
  if (a.error || b.error || !a.data || !a.data.length) { app.innerHTML = '<p class="fout">Deze link is niet (meer) geldig.</p>'; return; }
  info = a.data[0]; lijst = b.data; render();
}
function render() {
  document.getElementById('titel').textContent = `🎁 Lijstje van ${info.naam}`;
  const rijen = lijst.map(i => {
    const l = veilig(i.link), van = i.door_naam, mijn = van && naam && van.toLowerCase() === naam.trim().toLowerCase();
    const status = van ? `<span class="claim">🎁 ${esc(van)}</span>${mijn ? ` <button data-unclaim="${i.id}">Toch niet</button>` : ''}` : `<button class="ja" data-claim="${i.id}">Ik koop dit</button>`;
    return `<div class="rij"><span>${esc(i.titel)}${prijsTekst(i.prijs_van, i.prijs_tot)} ${l ? `<a href="${esc(l)}" target="_blank" rel="noopener noreferrer">🔗</a>` : ''}</span>${status}</div>`;
  }).join('') || '<p class="sub">Er staat nog niets op dit lijstje.</p>';
  app.innerHTML = `<div class="kaart"><label for="naam" class="sub">Jouw naam (zodat anderen zien dat jij iets koopt)</label>
    <input id="naam" type="text" maxlength="40" value="${esc(naam)}" placeholder="Bv. Oma Rita" autocomplete="name"></div>
    <div class="kaart">${rijen}</div><p class="sub">Dit is een privélink. Deel hem niet verder.</p>`;
}
app.addEventListener('input', e => { if (e.target.id === 'naam') { naam = e.target.value; try { localStorage.setItem('deelnaam', naam); } catch (x) {} } });
app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.claim || b.dataset.unclaim; if (!id) return;
  if (!naam.trim()) { document.getElementById('naam').focus(); return alert('Vul eerst je naam in.'); }
  const r = await sb.rpc(b.dataset.claim ? 'cadeau_deel_claim' : 'cadeau_deel_unclaim', { p_token: token, p_item: id, p_naam: naam.trim() });
  if (r.error || r.data === false) alert(b.dataset.claim ? 'Helaas, iemand anders was je net voor.' : 'Dat lukt niet.');
  laad();
});
laad();
</script>
</body>
</html>
