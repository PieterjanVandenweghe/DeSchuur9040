<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu & recepten</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="theme-color" content="#ff6b35">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gedeeld/stijl.css">
<style>
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:8px}.weeknav div{flex:1;text-align:center}
.dn{display:flex;flex-direction:column;min-width:96px}.dn small{color:var(--soft)}
.nu{background:#fff7d6;border-radius:12px}
.vorm{display:grid;gap:8px;margin-top:10px}
.gerecht a,.rij a{text-decoration:none}
.ingr{background:var(--bg);border-radius:16px;padding:10px 12px;margin:0 0 10px}
.hv{display:flex;gap:8px}.hv input{flex:2}.hv select{flex:1}
button[disabled]{opacity:.4;cursor:default}
#plan{max-width:440px;width:92vw}.planlijst{max-height:50vh;overflow:auto;margin:8px 0}.rij.uit{color:var(--soft)}.rij label{cursor:pointer}
#plan .rijknop{flex-wrap:wrap}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../gedeeld/basis.js"></script>
<script>
const B = Basis, sb = B.sb, esc = B.esc, app = document.getElementById('app');
const MENU_BEWAREN_WEKEN = 2;   // zoveel weken in het verleden blijft het menu bewaard
const DAGEN = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
let tab = 'menu', recepten = [], menu = [], producten = [], categorieen = [], ingr = [], ingrOk = true, bewerk = null, filter = '', open = null;
const maandagVan = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const plus = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const kort = d => d.toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' });
const minWeek = () => plus(maandagVan(new Date()), -7 * MENU_BEWAREN_WEKEN);
let week = maandagVan(new Date());
const num = n => String(+Number(n).toFixed(2));
const pnaam = id => (producten.find(p => p.id === id) || { naam: '?' }).naam;
function veilig(l) {
  if (!l) return null;
  try { const u = new URL(l.includes('://') ? l : 'https://' + l); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; }
}
const lnk = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`;

B.start('🍽️ Menu & recepten', laad, { app: 'menu' });
window.addEventListener('focus', () => { if (B.sessie && bewerk === null && open === null) laad(); });

async function laadMenu() {
  const r = await sb.from('menu_dagen').select('*').eq('week', B.iso(week));
  if (r.error) throw r.error; menu = r.data;
}
async function laadIngr() {
  const r = await sb.from('recept_ingredienten').select('*');
  ingrOk = !r.error; ingr = r.error ? [] : r.data;
}
async function laad() {
  if (!B.sessie) { app.innerHTML = '<p class="fout">Log eerst in (knop rechtsboven).</p>'; return; }
  try {
    await sb.from('menu_dagen').delete().lt('week', B.iso(minWeek()));   // oude menu's opruimen
    const [rec, prod, cat] = await Promise.all(['recepten', 'producten', 'categorieen'].map(t => sb.from(t).select('*')));
    const f = rec.error || prod.error || cat.error; if (f) throw f;
    recepten = rec.data.sort((a, b) => a.titel.localeCompare(b.titel)); producten = prod.data; categorieen = cat.data.sort((a, b) => a.standaard_volgorde - b.standaard_volgorde);
    await laadIngr(); await laadMenu();
  } catch (e) { app.innerHTML = `<p class="fout">Laden mislukt: ${esc(e.message)}. Zijn menu.sql en boodschappen.sql uitgevoerd?</p>`; return; }
  render();
}

function render() {
  const tabs = `<div class="tabs"><button data-tab="menu" class="${tab === 'menu' ? 'act' : ''}">🍽️ Weekmenu</button><button data-tab="recepten" class="${tab === 'recepten' ? 'act' : ''}">📖 Recepten</button></div>`;
  app.innerHTML = tabs + (tab === 'menu' ? menuHtml() : receptenHtml());
  if (tab === 'recepten') vulRecepten();
}

function menuHtml() {
  const nu = B.iso(new Date()), kanTerug = week > minWeek();
  const metIngr = menu.filter(m => m.recept_id && ingr.some(x => x.recept_id === m.recept_id)).length;
  const nav = `<div class="weeknav"><button data-week="-1" aria-label="Vorige week" ${kanTerug ? '' : 'disabled'}>◀</button><div><b>Week van ${kort(week)} tot ${kort(plus(week, 6))}</b></div><button data-week="1" aria-label="Volgende week">▶</button></div>
    <div class="rijknop" style="justify-content:center;margin:0 0 10px"><button data-week="0">Deze week</button></div>`;
  const rijen = DAGEN.map((naam, i) => {
    const d = plus(week, i), m = menu.find(x => x.dag === i) || {}, r = recepten.find(x => x.id === m.recept_id), isNu = B.iso(d) === nu;
    if (bewerk === i) {
      return `<div class="rij ${isNu ? 'nu' : ''}" style="display:block"><strong>${naam}</strong> <small class="sub">${kort(d)}</small>
        <div class="vorm"><input id="mtekst" type="text" maxlength="300" placeholder="Wat eten we?" value="${esc(m.tekst || '')}">
        <input id="mlink" type="text" inputmode="url" maxlength="1000" placeholder="Link (optioneel)" value="${esc(m.link || '')}">
        <select id="mrecept"><option value="">Of kies uit onze recepten…</option>${recepten.map(x => `<option value="${x.id}" ${x.id === m.recept_id ? 'selected' : ''}>${esc(x.titel)}</option>`).join('')}</select>
        <div class="rijknop"><button data-annuleer="1">Annuleer</button><button class="ja" data-bewaar="${i}">Bewaar</button></div></div></div>`;
    }
    const delen = [];
    if (m.tekst) delen.push(esc(m.tekst));
    if (r) delen.push(`📖 ${esc(r.titel)}${veilig(r.link) ? ' ' + lnk(veilig(r.link), '🔗') : ''}`);
    if (veilig(m.link)) delen.push(lnk(veilig(m.link), '🔗 link'));
    return `<div class="rij ${isNu ? 'nu' : ''}"><div class="dn"><b>${naam}</b><small>${kort(d)}</small></div><span class="gerecht">${delen.join('<br>') || '<span class="sub">Nog niets gepland</span>'}</span><button data-bewerk="${i}" aria-label="Bewerk ${naam}">✎</button></div>`;
  }).join('');
  const weekknop = metIngr ? `<div class="rijknop" style="justify-content:center;margin:0 0 10px"><button class="ja" data-weeklijst="1">🛒 Ingrediënten van deze week op het lijstje</button></div>` : '';
  return nav + weekknop + `<div class="kaart">${rijen}</div><p class="sub">Menu’s ouder dan ${MENU_BEWAREN_WEKEN} weken worden automatisch gewist.</p>`;
}

function receptenHtml() {
  return `<datalist id="prodlijst">${producten.slice().sort((a, b) => a.naam.localeCompare(b.naam)).map(p => `<option value="${esc(p.naam)}">`).join('')}</datalist>
    <div class="kaart"><strong>Recept toevoegen</strong><div class="vorm">
      <input id="rtitel" type="text" maxlength="200" placeholder="Naam van het gerecht" autocomplete="off">
      <input id="rlink" type="text" inputmode="url" maxlength="1000" placeholder="Link naar het recept (optioneel)" autocomplete="off">
      <input id="rnotitie" type="text" maxlength="500" placeholder="Notitie (optioneel, bv. “met de kinderen gemaakt”)" autocomplete="off">
      <button class="ja" data-addrec="1">Toevoegen</button></div></div>
    <div class="kaart"><input id="rzoek" type="search" placeholder="Zoek in recepten" value="${esc(filter)}" autocomplete="off"><div id="rlijst"></div></div>`;
}
function paneel(r) {
  const lijst = ingr.filter(x => x.recept_id === r.id);
  const andere = (categorieen.find(c => c.naam === 'Andere') || categorieen[0] || {}).id;
  return `<div class="ingr">
    ${ingrOk ? '' : '<p class="fout">Ingrediënten niet beschikbaar. Is recepten-ingredienten.sql uitgevoerd?</p>'}
    ${lijst.map(x => `<div class="rij"><span>${esc(pnaam(x.product_id))}${x.hoeveelheid ? ` <small class="sub">· ${num(x.hoeveelheid)} ${x.eenheid}</small>` : ''}</span><button data-delingr="${x.id}" aria-label="Verwijder ${esc(pnaam(x.product_id))}">✕</button></div>`).join('') || '<p class="sub">Nog geen ingrediënten.</p>'}
    <div class="vorm"><input type="text" list="prodlijst" data-iprod="${r.id}" id="iprod-${r.id}" placeholder="Ingrediënt (typ om te zoeken)" autocomplete="off">
      <div class="hv"><input id="ihv-${r.id}" type="number" inputmode="decimal" min="0" step="any" placeholder="Aantal (optioneel)" aria-label="Aantal"><select id="ieh-${r.id}" aria-label="Eenheid"><option value="st">st</option><option value="g">g</option><option value="ml">ml</option></select></div>
      <select id="icat-${r.id}" aria-label="Categorie voor een nieuw product">${categorieen.map(c => `<option value="${c.id}" ${c.id === andere ? 'selected' : ''}>${esc(c.naam)}</option>`).join('')}</select>
      <small class="sub">De categorie telt alleen voor een nieuw product dat nog niet in Boodschappen staat.</small>
      <button class="ja" data-addingr="${r.id}">Ingrediënt toevoegen</button></div>
    ${lijst.length ? `<div class="rijknop" style="justify-content:flex-start"><button class="ja" data-oplijst="${r.id}">🛒 Op het boodschappenlijstje</button></div>` : ''}</div>`;
}
function vulRecepten() {
  const el = document.getElementById('rlijst'); if (!el) return;
  const me = B.sessie.user.id, q = filter.trim().toLowerCase();
  const lijst = recepten.filter(r => !q || (r.titel + ' ' + (r.notitie || '')).toLowerCase().includes(q));
  el.innerHTML = lijst.map(r => {
    const n = ingr.filter(x => x.recept_id === r.id).length;
    return `<div><div class="rij"><span>${esc(r.titel)} ${veilig(r.link) ? lnk(veilig(r.link), '🔗') : ''}${r.notitie ? ` <small class="sub">· ${esc(r.notitie)}</small>` : ''}</span><button data-open="${r.id}" aria-expanded="${open === r.id}">🧾 ${n}</button>${B.isOuder || r.toegevoegd_door === me ? `<button data-delrec="${r.id}" aria-label="Verwijder ${esc(r.titel)}">✕</button>` : ''}</div>${open === r.id ? paneel(r) : ''}</div>`;
  }).join('') || `<p class="sub">${recepten.length ? 'Geen recepten gevonden.' : 'Nog geen recepten. Voeg er hierboven een toe.'}</p>`;
}

async function voegToe() {
  const titel = document.getElementById('rtitel').value.trim(), raw = document.getElementById('rlink').value.trim(), notitie = document.getElementById('rnotitie').value.trim();
  if (!titel) return;
  const link = raw ? veilig(raw) : null;
  if (raw && !link) return alert('Dat lijkt geen geldige link (http of https).');
  const { error } = await sb.from('recepten').insert({ titel, link, notitie: notitie || null });
  if (error) return alert('Opslaan mislukt: ' + error.message);
  await laad();
}

async function addIngr(rid) {
  const naam = document.getElementById('iprod-' + rid).value.trim(); if (!naam) return;
  const n = parseFloat(String(document.getElementById('ihv-' + rid).value).replace(',', '.')), eenh = document.getElementById('ieh-' + rid).value;
  let p = producten.find(x => x.naam.toLowerCase() === naam.toLowerCase());
  if (!p) {
    const r = await sb.from('producten').insert({ naam, categorie_id: document.getElementById('icat-' + rid).value, eenheid: eenh }).select().single();
    if (r.error) return alert('Nieuw product opslaan mislukt: ' + r.error.message);
    p = r.data; producten.push(p);
  }
  const { error } = await sb.from('recept_ingredienten').upsert({ recept_id: rid, product_id: p.id, hoeveelheid: n > 0 ? n : null, eenheid: eenh }, { onConflict: 'recept_id,product_id' });
  if (error) return alert('Opslaan mislukt: ' + error.message);
  await laadIngr(); render();
}

// Zet ingrediënten op het boodschappenlijstje: eerst een overzicht om per ingrediënt te kiezen, dan opslaan.
const hv = (n, u) => n == null ? 'zonder aantal' : `${num(n)} ${u}`;
function berekenPlan(lijstIngr, cur) {
  const som = new Map(), items = [];
  for (const x of lijstIngr) {
    const h = x.hoeveelheid == null ? null : Number(x.hoeveelheid), s = som.get(x.product_id);
    if (!s) som.set(x.product_id, { eenheid: x.eenheid, hoeveelheid: h });
    else if (s.eenheid === x.eenheid) { if (h != null) s.hoeveelheid = (s.hoeveelheid || 0) + h; }
    else items.push({ naam: pnaam(x.product_id), rij: null, tekst: `${hv(h, x.eenheid)} niet opgeteld: andere eenheid binnen deze selectie` });
  }
  for (const [pid, s] of som) {
    const e = cur.find(x => x.product_id === pid), prod = producten.find(p => p.id === pid);
    const basis = { product_id: pid, afgevinkt: false }, it = { naam: pnaam(pid), rij: null, tekst: '' };
    if (!e || e.afgevinkt) { it.rij = { ...basis, hoeveelheid: s.hoeveelheid, eenheid: s.eenheid }; it.tekst = `nieuw: ${hv(s.hoeveelheid, s.eenheid)}`; }
    else {
      const eEen = e.eenheid || (prod && prod.eenheid) || 'st';
      if (s.hoeveelheid == null) it.tekst = 'staat al op het lijstje';
      else if (e.hoeveelheid == null) { it.rij = { ...basis, hoeveelheid: s.hoeveelheid, eenheid: s.eenheid }; it.tekst = `staat er al zonder aantal, wordt ${hv(s.hoeveelheid, s.eenheid)}`; }
      else if (eEen === s.eenheid) {
        const tot = Math.round((Number(e.hoeveelheid) + s.hoeveelheid) * 100) / 100;
        it.rij = { ...basis, hoeveelheid: tot, eenheid: eEen }; it.tekst = `+ ${hv(s.hoeveelheid, s.eenheid)} bij ${hv(e.hoeveelheid, eEen)}, wordt ${hv(tot, eEen)}`;
      } else it.tekst = `${hv(s.hoeveelheid, s.eenheid)} niet opgeteld: op het lijstje staat ${hv(e.hoeveelheid, eEen)} (andere eenheid)`;
    }
    items.push(it);
  }
  return items;
}
let plan = [];
async function toonPlan(lijstIngr, titel) {
  const cur = await sb.from('lijst').select('*');
  if (cur.error) return alert('Het lijstje laden mislukt: ' + cur.error.message);
  plan = berekenPlan(lijstIngr, cur.data);
  let el = document.getElementById('plan');
  if (!el) { el = document.createElement('dialog'); el.id = 'plan'; document.body.appendChild(el); el.addEventListener('click', planKlik); }
  el.innerHTML = `<strong>${esc(titel)}</strong><p class="sub">Vink aan wat op het boodschappenlijstje mag. Wat al op het lijstje staat, wordt opgeteld.</p>
    <div class="planlijst">${plan.map((it, i) => `<label class="rij ${it.rij ? '' : 'uit'}"><input type="checkbox" data-p="${i}" ${it.rij ? 'checked' : 'disabled'}><span>${esc(it.naam)}<br><small class="sub">${esc(it.tekst)}</small></span></label>`).join('')}</div>
    <div class="rijknop"><button data-planalles="1">Alles</button><button data-plangeen="1">Niets</button><button data-planannuleer="1">Annuleer</button><button class="ja" data-planok="1">Toevoegen</button></div>`;
  el.showModal();
}
async function planKlik(e) {
  const t = e.target.closest('button'); if (!t) return; const el = document.getElementById('plan'), d = t.dataset;
  const boxen = () => [...el.querySelectorAll('input[data-p]:not([disabled])')];
  if (d.planannuleer) return el.close();
  if (d.planalles) return boxen().forEach(b => b.checked = true);
  if (d.plangeen) return boxen().forEach(b => b.checked = false);
  if (d.planok) {
    const rijen = boxen().filter(b => b.checked).map(b => plan[Number(b.dataset.p)].rij);
    if (!rijen.length) return el.close();
    const r = await sb.from('lijst').upsert(rijen, { onConflict: 'product_id' });
    if (r.error) return alert('Op het lijstje zetten mislukt: ' + r.error.message);
    el.close(); alert(`${rijen.length} ${rijen.length === 1 ? 'product' : 'producten'} op het boodschappenlijstje gezet.`);
  }
}

app.addEventListener('input', e => {
  if (e.target.id === 'rzoek') { filter = e.target.value; vulRecepten(); }
  if (e.target.dataset.iprod) {   // eenheid van een bestaand product alvast invullen
    const p = producten.find(x => x.naam.toLowerCase() === e.target.value.trim().toLowerCase());
    if (p) document.getElementById('ieh-' + e.target.dataset.iprod).value = p.eenheid || 'st';
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && ['rtitel', 'rlink', 'rnotitie'].includes(e.target.id)) { e.preventDefault(); voegToe(); } });
app.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.tab) { tab = d.tab; bewerk = null; open = null; return render(); }
  if (d.week !== undefined) {
    const nieuw = d.week === '0' ? maandagVan(new Date()) : plus(week, 7 * Number(d.week));
    if (nieuw < minWeek()) return;
    week = nieuw; bewerk = null;
    try { await laadMenu(); } catch (x) { return alert('Laden mislukt: ' + x.message); }
    return render();
  }
  if (d.bewerk !== undefined) { bewerk = Number(d.bewerk); return render(); }
  if (d.annuleer) { bewerk = null; return render(); }
  if (d.bewaar !== undefined) {
    const dag = Number(d.bewaar), tekst = document.getElementById('mtekst').value.trim() || null, raw = document.getElementById('mlink').value.trim();
    const recept = document.getElementById('mrecept').value || null, link = raw ? veilig(raw) : null;
    if (raw && !link) return alert('Dat lijkt geen geldige link (http of https).');
    const sleutel = B.iso(week);
    const r = (!tekst && !link && !recept)
      ? await sb.from('menu_dagen').delete().eq('week', sleutel).eq('dag', dag)
      : await sb.from('menu_dagen').upsert({ week: sleutel, dag, tekst, link, recept_id: recept }, { onConflict: 'week,dag' });
    if (r.error) return alert('Opslaan mislukt: ' + r.error.message);
    bewerk = null;
    try { await laadMenu(); } catch (x) { return alert('Laden mislukt: ' + x.message); }
    return render();
  }
  if (d.weeklijst) {
    const lijst = menu.filter(m => m.recept_id).flatMap(m => ingr.filter(x => x.recept_id === m.recept_id));
    if (lijst.length) toonPlan(lijst, 'Ingrediënten van deze week');
    return;
  }
  if (d.open) { open = open === d.open ? null : d.open; return vulRecepten(); }
  if (d.addingr) return addIngr(d.addingr);
  if (d.delingr) {
    const { error } = await sb.from('recept_ingredienten').delete().eq('id', d.delingr);
    if (error) return alert('Verwijderen mislukt: ' + error.message);
    await laadIngr(); return render();
  }
  if (d.oplijst) {
    const r = recepten.find(x => x.id === d.oplijst);
    return toonPlan(ingr.filter(x => x.recept_id === d.oplijst), r.titel);
  }
  if (d.addrec) return voegToe();
  if (d.delrec) {
    if (!confirm('Dit recept verwijderen?')) return;
    const { error } = await sb.from('recepten').delete().eq('id', d.delrec);
    if (error) return alert('Verwijderen mislukt: ' + error.message);
    await laad();
  }
});
</script>
</body>
</html>
