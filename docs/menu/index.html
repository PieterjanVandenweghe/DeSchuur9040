<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu & recepten</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icon.svg">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="theme-color" content="#ff6b35">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../gedeeld/stijl.css">
<style>
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:8px}.weeknav div{flex:1;text-align:center}
.dn{display:flex;flex-direction:column;min-width:96px}.dn small{color:var(--soft)}
.nu{background:#fff7d6;border-radius:12px}
.soep{border-bottom:2px dashed #d8d2ee}
.vorm{display:grid;gap:8px;margin-top:10px}
.gerecht a,.rij a{text-decoration:none}
.ingr{background:var(--bg);border-radius:16px;padding:10px 12px;margin:0 0 10px}
.nieuw{background:#fff7d6;border-radius:16px;padding:12px}.nieuw select{margin-top:8px}
.hv{display:flex;gap:8px}.hv input{flex:2}.hv select{flex:1}
button[disabled]{opacity:.4;cursor:default}
#plan{max-width:440px;width:92vw}.planlijst{max-height:50vh;overflow:auto;margin:8px 0}.rij.uit{color:var(--soft)}.rij label{cursor:pointer}
#plan .rijknop{flex-wrap:wrap}
#import{max-width:520px;width:94vw}.implijst{max-height:58vh;overflow:auto;margin:8px 0;display:grid;gap:10px}
.imp{background:var(--bg);border-radius:14px;padding:10px}.imp.uit{opacity:.5}.imp .orig{font-size:.85rem;color:var(--soft);display:flex;gap:8px;align-items:center}
.imp .vorm{margin-top:6px}.imp .nieuw{padding:8px}textarea{font:inherit;width:100%;min-height:9rem;padding:12px;border-radius:12px;border:2px solid #d8d2ee}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../gedeeld/basis.js"></script>
<script src="../gedeeld/ingredienten.js"></script>
<script>
const B = Basis, sb = B.sb, esc = B.esc, app = document.getElementById('app');
const MENU_BEWAREN_WEKEN = 2;   // zoveel weken in het verleden blijft het menu bewaard
const DAGEN = ['Maandag', 'Dinsdag', 'Woensdag', 'Donderdag', 'Vrijdag', 'Zaterdag', 'Zondag'];
let standaardPersonen = 4, tab = 'menu', recepten = [], menu = [], producten = [], categorieen = [], ingr = [], ingrOk = true, bewerk = null, filter = '', open = null;
const maandagVan = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const plus = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const kort = d => d.toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' });
const minWeek = () => plus(maandagVan(new Date()), -7 * MENU_BEWAREN_WEKEN);
let week = maandagVan(new Date());
const num = n => String(+Number(n).toFixed(2));
const pnaam = id => (producten.find(p => p.id === id) || { naam: '?' }).naam;
function veilig(l) {
  if (!l) return null;
  try { const u = new URL(l.includes('://') ? l : 'https://' + l); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; }
}
const lnk = (u, t) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`;

B.start('🍽️ Menu & recepten', laad, { app: 'menu', snel: 'boodschappen' });
window.addEventListener('focus', () => { if (B.sessie && bewerk === null && open === null) laad(); });

async function laadMenu() {
  const r = await sb.from('menu_dagen').select('*').eq('week', B.iso(week));
  if (r.error) throw r.error; menu = r.data;
}
async function laadIngr() {
  const r = await sb.from('recept_ingredienten').select('*');
  ingrOk = !r.error; ingr = r.error ? [] : r.data;
}
async function laad() {
  if (!B.sessie) { app.innerHTML = '<p class="fout">Log eerst in (knop rechtsboven).</p>'; return; }
  try {
    await sb.from('menu_dagen').delete().lt('week', B.iso(minWeek()));   // oude menu's opruimen
    const [rec, prod, cat] = await Promise.all(['recepten', 'producten', 'categorieen'].map(t => sb.from(t).select('*')));
    const f = rec.error || prod.error || cat.error; if (f) throw f;
    recepten = rec.data.sort((a, b) => a.titel.localeCompare(b.titel)); producten = prod.data; categorieen = cat.data.sort((a, b) => a.standaard_volgorde - b.standaard_volgorde);
    const ins = await sb.from('instellingen').select('waarde').eq('sleutel', 'standaard_personen').maybeSingle();
    if (!ins.error && ins.data) standaardPersonen = Number(ins.data.waarde) || 4;
    await laadIngr(); await laadMenu();
  } catch (e) { app.innerHTML = `<p class="fout">Laden mislukt: ${esc(e.message)}. Zijn menu.sql en boodschappen.sql uitgevoerd?</p>`; return; }
  render();
}

function render() {
  const tabs = `<div class="tabs"><button data-tab="menu" class="${tab === 'menu' ? 'act' : ''}">🍽️ Weekmenu</button><button data-tab="recepten" class="${tab === 'recepten' ? 'act' : ''}">📖 Recepten</button></div>`;
  app.innerHTML = tabs + (tab === 'menu' ? menuHtml() : receptenHtml());
  if (tab === 'recepten') vulRecepten();
}

function menuHtml() {
  const nu = B.iso(new Date()), kanTerug = week > minWeek();
  const metIngr = menu.filter(m => m.recept_id && ingr.some(x => x.recept_id === m.recept_id)).length;
  const nav = `<div class="weeknav"><button data-week="-1" aria-label="Vorige week" ${kanTerug ? '' : 'disabled'}>◀</button><div><b>Week van ${kort(week)} tot ${kort(plus(week, 6))}</b></div><button data-week="1" aria-label="Volgende week">▶</button></div>
    <div class="rijknop" style="justify-content:center;margin:0 0 10px"><button data-week="0">Deze week</button></div>`;
  const rijen = [7, 0, 1, 2, 3, 4, 5, 6].map(i => {
    const soep = i === 7, naam = soep ? '🍲 Soep' : DAGEN[i];
    const d = plus(week, soep ? 0 : i), m = menu.find(x => x.dag === i) || {}, r = recepten.find(x => x.id === m.recept_id), isNu = !soep && B.iso(d) === nu;
    const datum = soep ? 'van de week' : kort(d);
    if (bewerk === i) {
      return `<div class="rij ${isNu ? 'nu' : ''}" style="display:block"><strong>${naam}</strong> <small class="sub">${datum}</small>
        <div class="vorm"><input id="mtekst" type="text" maxlength="300" placeholder="${soep ? 'Welke soep?' : 'Wat eten we?'}" value="${esc(m.tekst || '')}">
        <input id="mlink" type="text" inputmode="url" maxlength="1000" placeholder="Link (optioneel)" value="${esc(m.link || '')}">
        <select id="mrecept"><option value="">Of kies uit onze recepten…</option>${recepten.map(x => `<option value="${x.id}" ${x.id === m.recept_id ? 'selected' : ''}>${esc(x.titel)}</option>`).join('')}</select>
        <label class="sub">👥 Personen <input id="mpers" type="number" inputmode="numeric" min="1" max="30" placeholder="${standaardPersonen} (standaard)" value="${m.personen || ''}" style="width:9rem"></label>
        <div class="rijknop"><button data-annuleer="1">Annuleer</button><button class="ja" data-bewaar="${i}">Bewaar</button></div></div></div>`;
    }
    const delen = [];
    if (m.tekst) delen.push(esc(m.tekst));
    if (r) delen.push(`📖 ${esc(r.titel)}${veilig(r.link) ? ' ' + lnk(veilig(r.link), '🔗') : ''}`);
    if (veilig(m.link)) delen.push(lnk(veilig(m.link), '🔗 link'));
    if (m.personen && m.personen !== standaardPersonen) delen.push(`<small class="sub">👥 ${m.personen} personen</small>`);
    return `<div class="rij ${isNu ? 'nu' : ''} ${soep ? 'soep' : ''}"><div class="dn"><b>${naam}</b><small>${datum}</small></div><span class="gerecht">${delen.join('<br>') || '<span class="sub">Nog niets gepland</span>'}</span><button data-bewerk="${i}" aria-label="Bewerk ${naam}">✎</button></div>`;
  }).join('');
  const weekknop = metIngr ? `<div class="rijknop" style="justify-content:center;margin:0 0 10px"><button class="ja" data-weeklijst="1">🛒 Ingrediënten van deze week op het lijstje</button></div>` : '';
  const pers = B.isOuder
    ? `<label>👥 Standaard aantal personen: <input id="stdpers" type="number" inputmode="numeric" min="1" max="30" value="${standaardPersonen}" style="width:5rem"></label>`
    : `👥 Standaard ${standaardPersonen} personen`;
  return nav + weekknop + `<div class="kaart">${rijen}</div><p class="sub">${pers}<br>Menu’s ouder dan ${MENU_BEWAREN_WEKEN} weken worden automatisch gewist.</p>`;
}

function receptenHtml() {
  return `<div class="kaart"><strong>Recept toevoegen</strong><div class="vorm">
      <input id="rtitel" type="text" maxlength="200" placeholder="Naam van het gerecht" autocomplete="off">
      <input id="rlink" type="text" inputmode="url" maxlength="1000" placeholder="Link naar het recept (optioneel)" autocomplete="off">
      <input id="rnotitie" type="text" maxlength="500" placeholder="Notitie (optioneel, bv. “met de kinderen gemaakt”)" autocomplete="off">
      <div class="rijknop" style="justify-content:flex-start"><button class="ja" data-addrec="1">Toevoegen</button><button data-importlink="1">🔗 Importeren van de link</button></div></div></div>
    <div class="kaart"><input id="rzoek" type="search" placeholder="Zoek in recepten" value="${esc(filter)}" autocomplete="off"><div id="rlijst"></div></div>`;
}
function paneel(r) {
  const lijst = ingr.filter(x => x.recept_id === r.id);
  const andere = (categorieen.find(c => c.naam === 'Andere') || categorieen[0] || {}).id;
  return `<div class="ingr">
    ${ingrOk ? '' : '<p class="fout">Ingrediënten niet beschikbaar. Is recepten-ingredienten.sql uitgevoerd?</p>'}
    <label class="sub">👥 Dit recept is voor <input type="number" inputmode="numeric" min="1" max="30" data-rpers="${r.id}" value="${r.personen || 4}" style="width:4.5rem"> personen</label>
    ${lijst.map(x => `<div class="rij"><span>${esc(pnaam(x.product_id))}${x.hoeveelheid ? ` <small class="sub">· ${num(x.hoeveelheid)} ${x.eenheid}</small>` : ''}</span><button data-delingr="${x.id}" aria-label="Verwijder ${esc(pnaam(x.product_id))}">✕</button></div>`).join('') || '<p class="sub">Nog geen ingrediënten.</p>'}
    <div class="vorm"><input type="text" data-iprod="${r.id}" id="iprod-${r.id}" placeholder="Ingrediënt (typ om te zoeken)" autocomplete="off"><div id="isug-${r.id}"></div>
      <div class="hv"><input id="ihv-${r.id}" type="number" inputmode="decimal" min="0" step="any" placeholder="Aantal (optioneel)" aria-label="Aantal"><select id="ieh-${r.id}" aria-label="Eenheid"><option value="st">st</option><option value="g">g</option><option value="ml">ml</option></select></div>
      <div id="icatvak-${r.id}" class="nieuw" hidden>➕ Nieuw product. Opslaan in:<select id="icat-${r.id}" aria-label="Categorie voor een nieuw product">${categorieen.map(c => `<option value="${c.id}" ${c.id === andere ? 'selected' : ''}>${esc(c.naam)}</option>`).join('')}</select></div>
      <button class="ja" data-addingr="${r.id}">Ingrediënt toevoegen</button>
      <details><summary class="sub">📋 Een hele lijst plakken</summary>
        <textarea id="iplak-${r.id}" placeholder="Plak hier de ingrediënten, één per regel (bv. 2 uien, 400 g gehakt)"></textarea>
        <button class="ja" data-plak="${r.id}">Lijst controleren</button></details></div>
    ${lijst.length ? `<div class="rijknop" style="justify-content:flex-start"><button class="ja" data-oplijst="${r.id}">🛒 Op het boodschappenlijstje</button></div>` : ''}</div>`;
}
function vulRecepten() {
  const el = document.getElementById('rlijst'); if (!el) return;
  const me = B.sessie.user.id, q = filter.trim().toLowerCase();
  const lijst = recepten.filter(r => !q || (r.titel + ' ' + (r.notitie || '')).toLowerCase().includes(q));
  el.innerHTML = lijst.map(r => {
    const n = ingr.filter(x => x.recept_id === r.id).length;
    return `<div><div class="rij"><span>${esc(r.titel)} ${veilig(r.link) ? lnk(veilig(r.link), '🔗') : ''}${r.notitie ? ` <small class="sub">· ${esc(r.notitie)}</small>` : ''}</span><button data-open="${r.id}" aria-expanded="${open === r.id}">🧾 ${n}</button>${B.isOuder || r.toegevoegd_door === me ? `<button data-delrec="${r.id}" aria-label="Verwijder ${esc(r.titel)}">✕</button>` : ''}</div>${open === r.id ? paneel(r) : ''}</div>`;
  }).join('') || `<p class="sub">${recepten.length ? 'Geen recepten gevonden.' : 'Nog geen recepten. Voeg er hierboven een toe.'}</p>`;
}

async function voegToe() {
  const titel = document.getElementById('rtitel').value.trim(), raw = document.getElementById('rlink').value.trim(), notitie = document.getElementById('rnotitie').value.trim();
  if (!titel) return;
  const link = raw ? veilig(raw) : null;
  if (raw && !link) return alert('Dat lijkt geen geldige link (http of https).');
  const { error } = await sb.from('recepten').insert({ titel: B.hoofdletter(titel), link, notitie: notitie || null });
  if (error) return alert('Opslaan mislukt: ' + error.message);
  await laad();
}

// Aanvullen zoals in Boodschappen: tik op een bestaand product, anders categorie kiezen voor een nieuw
function ingrSugg(rid) {
  const q = document.getElementById('iprod-' + rid).value, { treffers, exact } = B.zoekProducten(producten, q);
  const cat = id => (categorieen.find(c => c.id === id) || {}).naam || '';
  document.getElementById('isug-' + rid).innerHTML = treffers.length && !exact
    ? `<div class="sug">${treffers.map(p => `<button data-kiesprod="${p.id}" data-rid="${rid}">${esc(p.naam)} <small>· ${esc(cat(p.categorie_id))}</small></button>`).join('')}</div>` : '';
  document.getElementById('icatvak-' + rid).hidden = !q.trim() || !!exact;
  if (exact) document.getElementById('ieh-' + rid).value = exact.eenheid || 'st';
}
async function addIngr(rid) {
  const naam = document.getElementById('iprod-' + rid).value.trim(); if (!naam) return;
  const n = parseFloat(String(document.getElementById('ihv-' + rid).value).replace(',', '.')), eenh = document.getElementById('ieh-' + rid).value;
  let p = producten.find(x => x.naam.toLowerCase() === naam.toLowerCase());
  if (!p) {
    const r = await sb.from('producten').insert({ naam: B.hoofdletter(naam), categorie_id: document.getElementById('icat-' + rid).value, eenheid: eenh }).select().single();
    if (r.error) return alert('Nieuw product opslaan mislukt: ' + r.error.message);
    p = r.data; producten.push(p);
  }
  const { error } = await sb.from('recept_ingredienten').upsert({ recept_id: rid, product_id: p.id, hoeveelheid: n > 0 ? n : null, eenheid: eenh }, { onConflict: 'recept_id,product_id' });
  if (error) return alert('Opslaan mislukt: ' + error.message);
  await laadIngr(); render();
}

// Importeren: regels lezen, koppelen aan producten, laten controleren, dan opslaan.
let imp = { rid: null, rijen: [] };
const andereCat = () => (categorieen.find(c => c.naam === 'Andere') || categorieen[0] || {}).id;
function toonImport(rid, regels) {
  imp = { rid, rijen: regels.map(x => { const p = Ingr.koppel(x.naam, producten); return { ...x, naam: p ? p.naam : B.hoofdletter(x.naam), mee: true, cat: andereCat() }; }) };
  let el = document.getElementById('import');
  if (!el) {
    el = document.createElement('dialog'); el.id = 'import'; document.body.appendChild(el);
    el.addEventListener('click', importKlik); el.addEventListener('input', importInput); el.addEventListener('change', importInput);
  }
  const r = recepten.find(x => x.id === rid);
  el.innerHTML = `<strong>Ingrediënten voor ${esc(r ? r.titel : 'recept')}</strong>
    <p class="sub">Kijk elke regel na. Een bestaand product herken je aan de categorie; voor een nieuw product kies je er een.</p>
    <div class="implijst">${imp.rijen.map((x, i) => impRij(x, i)).join('') || '<p class="sub">Geen ingrediënten gevonden.</p>'}</div>
    <div class="rijknop"><button data-impannuleer="1">Annuleer</button><button class="ja" data-impok="1">Opslaan</button></div>`;
  el.showModal();
}
function impRij(x, i) {
  const { treffers, exact } = B.zoekProducten(producten, x.naam, 5);
  const cat = id => (categorieen.find(c => c.id === id) || {}).naam || '';
  return `<div class="imp ${x.mee ? '' : 'uit'}" id="imp-${i}"><label class="orig"><input type="checkbox" data-impmee="${i}" ${x.mee ? 'checked' : ''}> ${esc(x.tekst)}</label>
    <div class="vorm"><input type="text" data-impnaam="${i}" value="${esc(x.naam)}" placeholder="Product" autocomplete="off">
    <div data-impsug="${i}">${!exact && treffers.length ? `<div class="sug">${treffers.map(p => `<button data-impkies="${i}" data-p="${p.id}">${esc(p.naam)} <small>· ${esc(cat(p.categorie_id))}</small></button>`).join('')}</div>` : ''}</div>
    <div class="hv"><input type="number" inputmode="decimal" min="0" step="any" data-imphv="${i}" value="${x.hoeveelheid ?? ''}" placeholder="Aantal (optioneel)"><select data-impeh="${i}">${['st', 'g', 'ml'].map(u => `<option ${u === x.eenheid ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
    ${exact ? `<small class="sub">✓ ${esc(exact.naam)} · ${esc(cat(exact.categorie_id))}</small>` : `<div class="nieuw">➕ Nieuw product. Opslaan in: <select data-impcat="${i}">${categorieen.map(c => `<option value="${c.id}" ${c.id === x.cat ? 'selected' : ''}>${esc(c.naam)}</option>`).join('')}</select></div>`}</div></div>`;
}
function herteken(i) { const el = document.getElementById('imp-' + i), f = document.activeElement && document.activeElement.dataset.impnaam === String(i); el.outerHTML = impRij(imp.rijen[i], i); if (f) { const n = document.querySelector(`[data-impnaam="${i}"]`); n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
function importInput(e) {
  const d = e.target.dataset, x = imp.rijen[Number(d.impnaam ?? d.imphv ?? d.impeh ?? d.impcat ?? d.impmee)]; if (!x) return;
  if (d.impnaam !== undefined) { x.naam = e.target.value; if (e.type === 'input') herteken(Number(d.impnaam)); }
  if (d.imphv !== undefined) { const n = parseFloat(String(e.target.value).replace(',', '.')); x.hoeveelheid = n > 0 ? n : null; }
  if (d.impeh !== undefined) x.eenheid = e.target.value;
  if (d.impcat !== undefined) x.cat = e.target.value;
  if (d.impmee !== undefined && e.type === 'change') { x.mee = e.target.checked; document.getElementById('imp-' + d.impmee).classList.toggle('uit', !x.mee); }
}
async function importKlik(e) {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset, el = document.getElementById('import');
  if (d.impannuleer) return el.close();
  if (d.impkies !== undefined) { const p = producten.find(x => x.id === d.p), x = imp.rijen[Number(d.impkies)]; x.naam = p.naam; x.eenheid = x.hoeveelheid == null ? (p.eenheid || 'st') : x.eenheid; return herteken(Number(d.impkies)); }
  if (!d.impok) return;
  const mee = imp.rijen.filter(x => x.mee && x.naam.trim());
  t.disabled = true;
  try {
    const rijen = new Map();
    for (const x of mee) {
      let p = producten.find(q => q.naam.toLowerCase() === x.naam.trim().toLowerCase());
      if (!p) {
        const n = await sb.from('producten').insert({ naam: B.hoofdletter(x.naam), categorie_id: x.cat, eenheid: x.eenheid }).select().single();
        if (n.error) throw n.error; p = n.data; producten.push(p);
      }
      rijen.set(p.id, { recept_id: imp.rid, product_id: p.id, hoeveelheid: x.hoeveelheid, eenheid: x.eenheid });   // dubbel product: laatste regel telt
    }
    if (rijen.size) { const r = await sb.from('recept_ingredienten').upsert([...rijen.values()], { onConflict: 'recept_id,product_id' }); if (r.error) throw r.error; }
    el.close(); open = imp.rid; tab = 'recepten'; await laadIngr(); render();
  } catch (x) { t.disabled = false; alert('Opslaan mislukt: ' + x.message); }
}

// Recept van een link: titel, personen en ingrediënten via de Edge Function 'recept-import'
async function importLink() {
  const raw = document.getElementById('rlink').value.trim(), link = veilig(raw);
  if (!link) return alert('Plak eerst de link naar het recept in het veld “Link”.');
  const knop = document.querySelector('[data-importlink]'); knop.disabled = true; knop.textContent = 'Bezig met ophalen…';
  try {
    const { data, error } = await sb.functions.invoke('recept-import', { body: { url: link } });
    if (error) {   // bij een foutstatus zit onze uitleg ({ fout }) in het antwoord zelf
      let uitleg = null; try { uitleg = (await error.context.json()).fout; } catch (x) {}
      throw new Error(uitleg || error.message);
    }
    if (data.fout) throw new Error(data.fout);
    const titel = document.getElementById('rtitel').value.trim() || data.titel || 'Nieuw recept';
    const notitie = document.getElementById('rnotitie').value.trim() || null;
    const n = await sb.from('recepten').insert({ titel: B.hoofdletter(titel).slice(0, 200), link, notitie, personen: Ingr.personen(data.personen) || 4 }).select().single();
    if (n.error) throw n.error;
    recepten.push(n.data); recepten.sort((a, b) => a.titel.localeCompare(b.titel));
    ['rtitel', 'rlink', 'rnotitie'].forEach(id => { document.getElementById(id).value = ''; });
    open = n.data.id; render();
    toonImport(n.data.id, (data.ingredienten || []).map(Ingr.leesRegel).filter(x => x.naam));
  } catch (x) {
    alert('Importeren lukte niet: ' + x.message + '\nJe kunt het recept ook gewoon toevoegen en de ingrediënten plakken.');
  } finally { knop.disabled = false; knop.textContent = '🔗 Importeren van de link'; }
}

// Zet ingrediënten op het boodschappenlijstje: eerst een overzicht om per ingrediënt te kiezen, dan opslaan.
// Ingrediënten van een recept omgerekend naar een aantal personen
const geschaald = (rid, personen) => {
  const f = personen / ((recepten.find(x => x.id === rid) || {}).personen || 4);
  return ingr.filter(x => x.recept_id === rid).map(x => ({ ...x, hoeveelheid: x.hoeveelheid == null ? null : Number(x.hoeveelheid) * f }));
};
// Stuks naar boven afronden, gram/ml op een geheel getal
const rond = (n, u) => n == null ? null : u === 'st' ? Math.ceil(n - 1e-9) : Math.max(1, Math.round(n));
const hv = (n, u) => n == null ? 'zonder aantal' : `${num(n)} ${u}`;
function berekenPlan(lijstIngr, cur) {
  const som = new Map(), items = [];
  for (const x of lijstIngr) {
    const h = x.hoeveelheid == null ? null : Number(x.hoeveelheid), s = som.get(x.product_id);
    if (!s) som.set(x.product_id, { eenheid: x.eenheid, hoeveelheid: h });
    else if (s.eenheid === x.eenheid) { if (h != null) s.hoeveelheid = (s.hoeveelheid || 0) + h; }
    else items.push({ naam: pnaam(x.product_id), rij: null, tekst: `${hv(h, x.eenheid)} niet opgeteld: andere eenheid binnen deze selectie` });
  }
  for (const [pid, s] of som) {
    s.hoeveelheid = rond(s.hoeveelheid, s.eenheid);
    const e = cur.find(x => x.product_id === pid), prod = producten.find(p => p.id === pid);
    const basis = { product_id: pid, afgevinkt: false }, it = { naam: pnaam(pid), rij: null, tekst: '' };
    if (!e || e.afgevinkt) { it.rij = { ...basis, hoeveelheid: s.hoeveelheid, eenheid: s.eenheid }; it.tekst = `nieuw: ${hv(s.hoeveelheid, s.eenheid)}`; }
    else {
      const eEen = e.eenheid || (prod && prod.eenheid) || 'st';
      if (s.hoeveelheid == null) it.tekst = 'staat al op het lijstje';
      else if (e.hoeveelheid == null) { it.rij = { ...basis, hoeveelheid: s.hoeveelheid, eenheid: s.eenheid }; it.tekst = `staat er al zonder aantal, wordt ${hv(s.hoeveelheid, s.eenheid)}`; }
      else if (eEen === s.eenheid) {
        const tot = Math.round((Number(e.hoeveelheid) + s.hoeveelheid) * 100) / 100;
        it.rij = { ...basis, hoeveelheid: tot, eenheid: eEen }; it.tekst = `+ ${hv(s.hoeveelheid, s.eenheid)} bij ${hv(e.hoeveelheid, eEen)}, wordt ${hv(tot, eEen)}`;
      } else it.tekst = `${hv(s.hoeveelheid, s.eenheid)} niet opgeteld: op het lijstje staat ${hv(e.hoeveelheid, eEen)} (andere eenheid)`;
    }
    items.push(it);
  }
  return items;
}
let plan = [];
async function toonPlan(lijstIngr, titel) {
  const cur = await sb.from('lijst').select('*');
  if (cur.error) return alert('Het lijstje laden mislukt: ' + cur.error.message);
  plan = berekenPlan(lijstIngr, cur.data);
  let el = document.getElementById('plan');
  if (!el) { el = document.createElement('dialog'); el.id = 'plan'; document.body.appendChild(el); el.addEventListener('click', planKlik); }
  el.innerHTML = `<strong>${esc(titel)}</strong><p class="sub">Vink aan wat op het boodschappenlijstje mag. Wat al op het lijstje staat, wordt opgeteld.</p>
    <div class="planlijst">${plan.map((it, i) => `<label class="rij ${it.rij ? '' : 'uit'}"><input type="checkbox" data-p="${i}" ${it.rij ? 'checked' : 'disabled'}><span>${esc(it.naam)}<br><small class="sub">${esc(it.tekst)}</small></span></label>`).join('')}</div>
    <div class="rijknop"><button data-planalles="1">Alles</button><button data-plangeen="1">Niets</button><button data-planannuleer="1">Annuleer</button><button class="ja" data-planok="1">Toevoegen</button></div>`;
  el.showModal();
}
async function planKlik(e) {
  const t = e.target.closest('button'); if (!t) return; const el = document.getElementById('plan'), d = t.dataset;
  const boxen = () => [...el.querySelectorAll('input[data-p]:not([disabled])')];
  if (d.planannuleer) return el.close();
  if (d.planalles) return boxen().forEach(b => b.checked = true);
  if (d.plangeen) return boxen().forEach(b => b.checked = false);
  if (d.planok) {
    const rijen = boxen().filter(b => b.checked).map(b => plan[Number(b.dataset.p)].rij);
    if (!rijen.length) return el.close();
    const r = await sb.from('lijst').upsert(rijen, { onConflict: 'product_id' });
    if (r.error) return alert('Op het lijstje zetten mislukt: ' + r.error.message);
    el.close(); alert(`${rijen.length} ${rijen.length === 1 ? 'product' : 'producten'} op het boodschappenlijstje gezet.`);
  }
}

app.addEventListener('input', e => {
  if (e.target.id === 'rzoek') { filter = e.target.value; vulRecepten(); }
  if (e.target.dataset.iprod) ingrSugg(e.target.dataset.iprod);
});
app.addEventListener('change', async e => {
  const t = e.target, n = Math.min(30, parseInt(t.value, 10));
  if (!(n > 0) || !(t.id === 'stdpers' || t.dataset.rpers)) return;
  const r = t.id === 'stdpers'
    ? await sb.from('instellingen').upsert({ sleutel: 'standaard_personen', waarde: n })
    : await sb.from('recepten').update({ personen: n }).eq('id', t.dataset.rpers).select('id');
  if (!r.error && t.dataset.rpers && !r.data.length) r.error = { message: 'je mag dit recept niet wijzigen (alleen een ouder of wie het toevoegde)' };
  if (r.error) return alert('Opslaan mislukt: ' + r.error.message + '. Is menu-personen-soep.sql uitgevoerd?');
  if (t.id === 'stdpers') { standaardPersonen = n; render(); } else { const x = recepten.find(y => y.id === t.dataset.rpers); if (x) x.personen = n; }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && ['rtitel', 'rlink', 'rnotitie'].includes(e.target.id)) { e.preventDefault(); voegToe(); } });
app.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return; const d = t.dataset;
  if (d.tab) { tab = d.tab; bewerk = null; open = null; return render(); }
  if (d.week !== undefined) {
    const nieuw = d.week === '0' ? maandagVan(new Date()) : plus(week, 7 * Number(d.week));
    if (nieuw < minWeek()) return;
    week = nieuw; bewerk = null;
    try { await laadMenu(); } catch (x) { return alert('Laden mislukt: ' + x.message); }
    return render();
  }
  if (d.bewerk !== undefined) { bewerk = Number(d.bewerk); return render(); }
  if (d.annuleer) { bewerk = null; return render(); }
  if (d.bewaar !== undefined) {
    const dag = Number(d.bewaar), tekst = B.hoofdletter(document.getElementById('mtekst').value) || null, raw = document.getElementById('mlink').value.trim();
    const recept = document.getElementById('mrecept').value || null, link = raw ? veilig(raw) : null;
    const pn = parseInt(document.getElementById('mpers').value, 10), personen = pn > 0 && pn !== standaardPersonen ? Math.min(pn, 30) : null;
    if (raw && !link) return alert('Dat lijkt geen geldige link (http of https).');
    const sleutel = B.iso(week);
    const r = (!tekst && !link && !recept)
      ? await sb.from('menu_dagen').delete().eq('week', sleutel).eq('dag', dag)
      : await sb.from('menu_dagen').upsert({ week: sleutel, dag, tekst, link, recept_id: recept, personen }, { onConflict: 'week,dag' });
    if (r.error) return alert('Opslaan mislukt: ' + r.error.message);
    bewerk = null;
    try { await laadMenu(); } catch (x) { return alert('Laden mislukt: ' + x.message); }
    return render();
  }
  if (d.weeklijst) {
    const lijst = menu.filter(m => m.recept_id).flatMap(m => geschaald(m.recept_id, m.personen || standaardPersonen));
    if (lijst.length) toonPlan(lijst, 'Ingrediënten van deze week');
    return;
  }
  if (d.open) { open = open === d.open ? null : d.open; return vulRecepten(); }
  if (d.addingr) return addIngr(d.addingr);
  if (d.plak) {
    const regels = Ingr.leesTekst(document.getElementById('iplak-' + d.plak).value);
    if (!regels.length) return alert('Ik vond geen ingrediënten. Plak één ingrediënt per regel.');
    return toonImport(d.plak, regels);
  }
  if (d.importlink) return importLink();
  if (d.kiesprod) {
    const p = producten.find(x => x.id === d.kiesprod), i = document.getElementById('iprod-' + d.rid);
    i.value = p.naam; ingrSugg(d.rid); document.getElementById('ihv-' + d.rid).focus(); return;
  }
  if (d.delingr) {
    const { error } = await sb.from('recept_ingredienten').delete().eq('id', d.delingr);
    if (error) return alert('Verwijderen mislukt: ' + error.message);
    await laadIngr(); return render();
  }
  if (d.oplijst) {
    const r = recepten.find(x => x.id === d.oplijst);
    return toonPlan(geschaald(d.oplijst, standaardPersonen), `${r.titel} (${standaardPersonen} personen)`);
  }
  if (d.addrec) return voegToe();
  if (d.delrec) {
    if (!confirm('Dit recept verwijderen?')) return;
    const { error } = await sb.from('recepten').delete().eq('id', d.delrec);
    if (error) return alert('Verwijderen mislukt: ' + error.message);
    await laad();
  }
});
</script>
